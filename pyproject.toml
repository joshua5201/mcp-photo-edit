[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-photo-edit"
version = "0.2.2"
description = "MCP server for session-based photo editing with pluggable RAW backends"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0,<2",
  "Pillow>=10,<12",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
mcp-photo-edit = "mcp_photo_edit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_photo_edit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
